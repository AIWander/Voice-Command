name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: voice-mcp-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: voice-mcp-arm64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: voice-mcp-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: voice-mcp-darwin-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: voice-mcp
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          src="voice-mcp/target/${{ matrix.target }}/release/voice-mcp"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            src="${src}.exe"
          fi
          mv "$src" "${{ matrix.artifact }}"
      # --- Authenticode (Azure Trusted Signing, publisher "Joseph Wander") ---
      # No-ops safely until the repo secrets exist: AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (a service principal with the
      # "Trusted Signing Certificate Profile Signer" role on the AIWander
      # signing account). Cosign/Sigstore signing below is unaffected.
      - name: Check Authenticode secrets
        id: cansign
        if: contains(matrix.target, 'windows')
        shell: bash
        env:
          AZ: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZ" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Azure signing secrets not configured - skipping Authenticode (cosign still signs)."; fi
      - name: Authenticode sign (Azure Trusted Signing)
        if: contains(matrix.target, 'windows') && steps.cansign.outputs.ok == 'true'
        uses: azure/trusted-signing-action@v5
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: AIWander
          certificate-profile-name: cpc-signing
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via Sigstore OIDC
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign binaries + checksums (keyless / Sigstore)
        working-directory: dist
        # Verify with:
        #   cosign verify-blob --certificate <f>.pem --signature <f>.sig \
        #     --certificate-identity-regexp 'https://github.com/AIWander/Voice-Command/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <f>
        run: |
          for f in voice-mcp-* SHA256SUMS; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/voice-mcp-*
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
