name: Supply Chain
on:
  push:
    branches: [main]
    paths: ["voice-mcp/**/Cargo.toml", "voice-mcp/**/Cargo.lock", ".github/workflows/supply-chain.yml"]
  pull_request:
    paths: ["voice-mcp/**/Cargo.toml", "voice-mcp/**/Cargo.lock", ".github/workflows/supply-chain.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked
      - name: Ensure lockfile
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: cargo audit
        run: cargo audit
