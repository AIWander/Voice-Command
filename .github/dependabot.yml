# Dependabot configuration for CI and the embedded Rust wrapper.
# Python dependencies remain manual here; GitHub Actions and Cargo updates
# are tracked in-repo.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # No custom labels: Dependabot applies its defaults (dependencies,
    # github_actions) and creates them if missing. A custom label must
    # already exist in the repo, and "github-actions" never did.
  - package-ecosystem: "cargo"
    directory: "/voice-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # No custom labels either: the defaults (dependencies, rust) are
    # created when missing; a custom "rust" label never existed here.
