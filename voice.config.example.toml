# Voice-Command — example configuration
# Copy this file to `voice.config.toml` (next to voice_server.py) or set
# the VOICE_CONFIG_PATH environment variable to point at it.
#
# The Rust voice-mcp server and Python voice services read TTS/STT values on
# each call. Interruption-listener timing values load when the Voice App starts;
# phrase changes made in the widget apply immediately and persist per user.
# Per-call parameters override matching TTS/STT values.

[defaults]
speed = 1.0
pitch = "+0Hz"
volume = 1.0

[edge-tts]
voice = "en-GB-RyanNeural"
speed = 1.0
pitch = "+0Hz"
volume = 1.0

[piper]
# Optional fallback TTS engine
model = "en_US-lessac-medium"
speed = 1.0
volume = 0.55

[kokoro]
# Optional fallback TTS engine
voice = "af_heart"
speed = 1.0
volume = 0.55

[listen]
# Tuned for natural conversational back-and-forth.
# For typing-replacement / dictating long prose, raise silence_timeout_secs
# to 5.0+ so natural pauses don't cut you off mid-thought.
silence_timeout_secs = 3.0
min_speech_duration_secs = 2.0
rms_threshold = 100.0
pre_record_enabled = true
noise_filter_enabled = true
listen_timeout_secs = 120
# Whisper beam search width (higher = more accurate, slower)
beam_size = 5

[interruption_listener]
# A no-beep phrase-only listener runs while assistant audio is playing or held.
# A match pauses playback and hands the mic to the regular beep-and-transcribe
# listener. The widget can override this phrase list for the current user.
enabled = true
trigger_phrases = ["umm"]
listen_while_paused = true
window_secs = 1.5
rms_threshold = 100.0
cooldown_secs = 1.5
# If no speech follows the regular-listener beep after a trigger, resume.
empty_handoff_timeout_secs = 5.0

[playback]
# Voice App (voice_app.py, Windows) playback engine. "auto" tries winsdk —
# a native Windows media session, so your headset play/pause button is
# routed by the OS — and falls back to a PowerShell-hosted player with a
# global media-key hook. Options: auto | winsdk | subproc
backend = "auto"
# In subproc mode, capture the play/pause media key while audio is active
media_key_hook = true
# Keep the Voice App window above other windows
always_on_top = false
